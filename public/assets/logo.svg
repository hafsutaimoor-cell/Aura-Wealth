<svg width="200" height="230" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.15" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Shield crest -->
  <path
    d="M100 42 C70 42 50 70 50 105 C50 135 85 155 100 165 C115 155 150 135 150 105 C150 70 130 42 100 42 Z"
    fill="url(#shieldGradient)"
    stroke="url(#brandGradient)"
    stroke-width="4"
    filter="url(#glow)"
  />

  <!-- Inner stylized A with upward arrow -->
  <g transform="translate(30, 55) scale(0.92)">
    <path
      d="M70 5 L100 55 L130 5 L115 35 L100 25 L85 35 Z"
      fill="none"
      stroke="url(#brandGradient)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#glow)"
    />
    <path
      d="M100 60 L85 35 L100 25"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Wordmark -->
  <text x="100" y="185" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="30" letter-spacing="-1" fill="#FFFFFF">
    <tspan x="100" dy="0" fill="url(#brandGradient)">A</tspan>
    <tspan x="122" dy="0">URA</tspan>
  </text>
  <text x="100" y="210" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="15" letter-spacing="2" fill="#FFFFFF">WEALTH</text>
</svg>
